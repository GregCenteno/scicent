[build]
  command = "npm run build"
  publish = ".next"

# Adapta el build de Next.js (App Router, API routes, middleware) al
# runtime de Netlify automáticamente — no hay que tocar next.config.mjs.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Reemplaza el cron de vercel.json (Netlify lo ignora). Llama a
# netlify/functions/refresh-articles.js con este horario — mismo
# "cada 6 horas" que ya usaba vercel.json.
[functions."refresh-articles"]
  schedule = "0 */6 * * *"
